[main]
disable = 1
# Cle de chiffrement des secrets de canaux (mots de passe SMTP, jetons).
# 32 caracteres exactement, AES-256. A generer a l installation et a garder :
# la perdre rend illisibles les secrets deja enregistres.
# A placer de preference dans reflex.ini.local, non distribue par le paquet.
keyAES32 =

[database]
dbdriver = mysql
dbhost = localhost
dbport = 3306
dbname = reflex
dbuser = mmc
dbpasswd = mmc

# Ce fichier ne porte que ce qui est lu avant toute connexion a la base :
# l activation du plugin, la cle de chiffrement et la connexion elle-meme.
# Le niveau de log ne s y trouve pas : la journalisation appartient a
# mmc-agent et aux substituts, qui ont chacun leur propre configuration.
#
# Les reglages d exploitation -- retentions, limites d evaluation -- vivent
# dans la table settings de la base reflex. Ils ne sont pas repris ici : une
# valeur qui traine dans un fichier sans etre lue finit par etre modifiee par
# quelqu un persuade d agir sur le module.
